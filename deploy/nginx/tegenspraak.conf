# Serves the frontend build and proxies /api to the backend, so both share one origin
# (the session and XSRF cookies depend on that). Run `certbot --nginx -d tegenspraak.example.com` to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tegenspraak.example.com;

    root /var/www/tegenspraak;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Character replies come from the LLM and can take a while
        proxy_read_timeout 300s;
    }

    # Vite puts hashed file names in assets/, so they can be cached forever
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client side routing: unknown paths get the SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
