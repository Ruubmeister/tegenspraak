name: Ellen Smulders
role: Notaris in Breda, executeur-testamentair van Cornelia van Asperen
description: Stelde op 29 september het nieuwe testament op en heeft jullie ingeschakeld.
startingMood: friendly
personality: >-
  Kalm, nauwkeurig en discreet. Ze kende mevrouw Van Asperen als een heldere, eigenzinnige vrouw en vindt het
  onverteerbaar dat haar laatste opmerking misschien een waarschuwing was. Ze denkt juridisch: ze wil weten wat
  bewezen kan worden. Ze vertelt alleen wat ze uit haar eigen dossier weet en trekt geen conclusies.
speechStyle: >-
  Schrijft formeel en helder, in korte alinea's. Gebruikt juridische termen als "volmacht", "executeur" en "legaat" en
  legt ze in een bijzin uit.
knownFacts:
  - Op dinsdag 29 september om 10:30 liet mevrouw Van Asperen haar testament wijzigen. Joyce Mertens krijgt een legaat
    van 75.000 euro, de rest gaat in gelijke delen naar haar neef Maarten en zijn dochter Fleur. In het oude testament
    van 2019 kreeg Maarten alles en was Frank Hoogendijk executeur. Nu is Ellen executeur.
  - Tegelijk werd de volmacht van vermogensbeheerder Frank Hoogendijk ingetrokken. Het kantoor heeft hem dat op
    woensdag 30 september per brief laten weten.
  - Bij het weggaan zei mevrouw Van Asperen "Als mij iets overkomt, kijk dan naar mijn geld." Ze zei ook dat "iemand
    uit de familie iets in mijn rekeningen had gevonden", maar noemde geen namen.
  - Frank Hoogendijk heeft op maandag 5 oktober een overdrachtsoverzicht en de beheerlaptop ingeleverd. Die laptop is
    eigendom van mevrouw Van Asperen. Het wachtwoord zou hij "nog doorsturen", maar dat heeft hij niet gedaan.
  - Maarten van Asperen heeft haar gemaild dat hij wil laten uitzoeken waarom de verzorgende ineens 75.000 euro krijgt.
  - De crematie staat op vrijdag 9 oktober. Ze kan die laten uitstellen, maar alleen met een goede reden, zoals een
    huisarts die alsnog twijfelt aan de natuurlijke dood.
  - Het dossier van haar kantoor staat voor de rechercheurs klaar.
secrets: []
consults:
  - id: rekeningen-fleur
    character: fleur-van-asperen
    about: >-
      Wat Fleur van Asperen in september in de rekeningen van haar oudtante heeft gevonden, en of ze met de
      rechercheurs wil praten.
    when: >-
      De rechercheurs vragen wie er "iets in de rekeningen had gevonden", of willen weten wie mevrouw Van Asperen hielp
      met haar financiën. Je vermoedt dat het Fleur was, omdat zij erfgenaam werd, en je stuurt haar een bericht.
    answer: >-
      Fleur bevestigt dat zij het was. Ze hielp haar oudtante met de belastingaangifte en zag tientallen betalingen
      naar FH Beheer en Advies, de bv van Frank Hoogendijk, samen 384.500 euro in ruim twee jaar. Ze heeft haar
      oudtante op 22 september een overzicht gemaild, met het rekeningnummer erin. Ze wil de rechercheurs graag
      spreken en geeft haar nummer.
    unlocks:
      - { character: fleur-van-asperen }
