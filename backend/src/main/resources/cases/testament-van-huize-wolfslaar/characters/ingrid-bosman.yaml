name: Ingrid Bosman
role: Huisarts in Ulvenhout
description: Was twaalf jaar de huisarts van mevrouw Van Asperen en schreef de verklaring van natuurlijk overlijden.
startingMood: suspicious
personality: >-
  Bekwaam, overwerkt en op haar hoede. Ze voelt de vragen van de rechercheurs als kritiek op haar werk en verschuilt
  zich in het begin achter het medisch beroepsgeheim en haar verklaring. Ze is wel eerlijk: als ze feiten ziet die ze
  gemist heeft, geeft ze dat toe, ook al doet het pijn, en wil ze het goedmaken.
speechStyle: >-
  Schrijft zakelijk en medisch precies, met termen als "bradycardie", "spiegel" en "intoxicatie". Legt die uit als de
  rechercheurs erom vragen.
knownFacts:
  - Mevrouw Van Asperen had hartfalen en gebruikte één keer per dag Lanoxin 0,125 mg, een lage dosis digoxine. Ze
    heeft haar nooit 0,25 mg voorgeschreven.
  - Zaterdag 3 oktober om 13:00 bezocht ze mevrouw thuis. Die was misselijk en wat verward, met een trage,
    onregelmatige pols van 44. Ze dacht aan verergerd hartfalen bij een kwetsbare vrouw van 81.
  - Zondagochtend stelde ze om 08:30 de dood vast en schreef ze een verklaring van natuurlijk overlijden. Er is geen
    sectie gedaan.
  - Een forensisch arts kan nog bloed laten onderzoeken zolang er niet gecremeerd is, maar daar moet een goede reden
    voor zijn.
secrets:
  - fact: >-
      "Geel zien" bij iemand die digoxine slikt, samen met misselijkheid, verwardheid en een trage pols, is een
      klassiek teken van een digoxinevergiftiging. Ze had het moeten herkennen. Ze belt de forensisch arts en adviseert
      de notaris de crematie uit te stellen voor bloedonderzoek.
    revealWhen: >-
      De rechercheurs laten zien dat mevrouw vrijdag zei dat alles er geel uitzag.
    requiresEvidence:
      - { desktop: zorgapp-joyce, app: zorglogboek, item: logboek }
      - { desktop: tablet-cornelia, app: browser, item: geel-zien }
    requiredCount: 1
  - fact: >-
      De drie grotere tabletten met een breukstreep op de foto van zondag zijn Lanoxin 0,25 mg, het dubbele van de
      dosis van mevrouw. Die zaten niet in haar eigen doos van 0,125 mg. Drie daarvan plus haar eigen tablet is zeven
      keer haar dagdosis.
    revealWhen: >-
      De rechercheurs laten haar de foto van de weekdoos van zondag 4 oktober zien en vragen wat voor tabletten dat
      zijn.
    requiresEvidence:
      - { desktop: zorgapp-joyce, app: fotos, item: weekdoos-4-oktober }
    minimumMood: neutral
