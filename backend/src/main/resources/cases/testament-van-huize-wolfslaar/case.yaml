title: Het testament van Huize Wolfslaar (expert)
summary: >-
  Een rijke weduwe overlijdt aan hartfalen, vijf dagen nadat ze haar testament heeft laten wijzigen. De huisarts ziet
  niets vreemds. De notaris wel, en de crematie is al vrijdag.
difficulty: expert
introduction: >-
  Het is dinsdag 6 oktober. Notaris mr. Ellen Smulders uit Breda heeft jullie team ingeschakeld. Op zondagochtend 4
  oktober werd mevrouw Cornelia van Asperen (81) dood aangetroffen in haar bed op landgoed Huize Wolfslaar in
  Ulvenhout. Haar huisarts verklaarde een natuurlijke dood door hartfalen. Maar op dinsdag 29 september had mevrouw
  Van Asperen bij Ellen haar testament laten wijzigen, en bij het weggaan zei ze: "Als mij iets overkomt, kijk dan naar
  mijn geld." De crematie staat gepland voor vrijdag 9 oktober. Ellen kan die een paar dagen laten uitstellen, maar dan
  wil ze wel weten waarom. Jullie hebben het dossier van het notariskantoor, de tablet van mevrouw Van Asperen en de
  zorgapp van haar verzorgende tot je beschikking. De laptop waarmee haar vermogensbeheerder de administratie deed en
  het account van de deurbelcamera zijn beveiligd.
setting: >-
  Cornelia "Cor" van Asperen (81), weduwe van Huib van Asperen, woonde alleen op Huize Wolfslaar in Ulvenhout bij
  Breda. Ze leerde Huib kennen op het bevrijdingsbal van 5 mei 1965 in Breda. Ze had hartfalen en slikte elke ochtend
  bij het ontbijt één tablet Lanoxin 0,125 mg (digoxine) uit een weekdoos. Verzorgende Joyce Mertens (42) woont in het
  koetshuis op het landgoed, werkt van 08:00 tot 18:00 en heeft op donderdagmiddag vrij. Ze vult elke zondagavond de
  weekdoos (maandag tot en met zondag) en maakt er een foto van. Op zondag 27 september om 19:10 vulde ze de weekdoos
  voor 28 september tot en met 4 oktober en brak een nieuwe doos Lanoxin van 30 tabletten aan; daarna zaten er 23 in
  de doos. Sinds Huibs dood in 2020 had vermogensbeheerder Frank Hoogendijk (61) een volmacht over haar rekeningen. Via
  zijn bv FH Beheer en Advies (rekening NL71 INGB 0006 4471 39) maakte hij in 26 maanden 384.500 euro naar zichzelf
  over, geboekt als "advieskosten" en "onderhoud landgoed". In september hielp achternicht Fleur van Asperen (23),
  studente accountancy en dochter van neef Maarten, met de belastingaangifte en zag de betalingen. Ze mailde Cornelia
  op 22 september een overzicht. Op dinsdag 29 september liet Cornelia bij notaris Ellen Smulders haar testament
  wijzigen: Joyce krijgt 75.000 euro, de rest gaat in gelijke delen naar Maarten en Fleur (in het oude testament uit
  2019 kreeg Maarten alles en was Frank executeur), Ellen wordt executeur en Franks volmacht werd ingetrokken. Cornelia
  maakte een afspraak met de Rabobank voor maandag 5 oktober om 10:00, samen met Fleur, om alle rekeningen door te
  nemen. Op woensdag 30 september kreeg Frank een brief van het notariskantoor over de intrekking. Hij mailde Cornelia
  diezelfde avond of hij donderdag "alles kon komen uitleggen", en zocht die nacht op internet naar digoxinevergiftiging
  en naar crematie zonder sectie. Zijn moeder Wilhelmina "Mien" Hoogendijk-Verbeek was op 9 maart 2026 overleden aan
  hartfalen; haar overgebleven Lanoxin 0,25 mg (grotere tabletten met een breukstreep) had Frank nooit teruggebracht
  naar de apotheek. Op donderdag 1 oktober kwam Frank om 14:02 met zijn donkerblauwe Volvo naar Wolfslaar, terwijl
  Joyce vrij was. In zijn agenda stond een klant in Tilburg. Cornelia vroeg hem een glas water te halen; tuinman Kees
  Brouwer, die op donderdagmiddag werkt, zag hem ruim tien minuten alleen in de keuken, waar de weekdoos op de
  vensterbank stond. Frank legde in de vakjes van vrijdag, zaterdag en zondag elk drie tabletten van 0,25 mg bij. Hij
  vertrok om 15:24. Vrijdag 2 oktober werd Cornelia misselijk en zei ze 's middags dat alles er geel uitzag, een
  klassiek teken van digoxinevergiftiging; Joyce schreef het in het zorglogboek. Vrijdagavond van 18:58 tot 21:16 at
  neef Maarten (52) bij haar. Hij heeft schulden en vroeg haar 40.000 euro; ze weigerde en vertelde over het nieuwe
  testament, en ze kregen ruzie. Zaterdag was Cornelia verward en had ze een trage, onregelmatige hartslag. Huisarts
  Ingrid Bosman kwam om 13:00, dacht aan verergerd hartfalen en keek niet naar de pillen. Cornelia overleed in de nacht
  van 3 op 4 oktober. Joyce vond haar zondag om 07:30 en fotografeerde om 09:05 voor de huisarts de weekdoos: in het
  vakje van zondag lagen één klein tablet en drie grotere. De doos Lanoxin bevatte nog steeds 23 tabletten, dus de
  extra tabletten kwamen niet uit Cornelia's eigen voorraad. Dokter Bosman schreef een verklaring van natuurlijk
  overlijden. Frank leverde op 5 oktober bij de notaris een opgeschoond overdrachtsoverzicht en de beheerlaptop in,
  die eigendom is van Cornelia, en zei dat hij het wachtwoord "nog zou doorsturen". Joyce en Maarten zijn onschuldig.
solution:
  questions:
    - id: wie
      question: Wie is verantwoordelijk voor de dood van Cornelia van Asperen?
      answer: Frank Hoogendijk, haar vermogensbeheerder.
    - id: doodsoorzaak
      question: Waaraan is Cornelia van Asperen werkelijk overleden, en hoe kreeg ze dat binnen?
      answer: >-
        Kernpunten: een overdosis digoxine (haar hartmedicijn Lanoxin); er waren extra tabletten in haar weekdoos
        gelegd, in de vakjes van na donderdag.
    - id: wanneer
      question: Wanneer en hoe kon de dader bij de medicijnen komen?
      answer: >-
        Kernpunten: op donderdagmiddag 1 oktober, toen de verzorgende vrij had; hij was alleen in de keuken waar de
        weekdoos stond, toen hij voor mevrouw een glas water ging halen.
    - id: herkomst
      question: Waar kwamen de extra tabletten vandaan?
      answer: >-
        Kernpunten: uit de overgebleven medicijnen (Lanoxin 0,25 mg) van de overleden moeder van de dader; niet uit
        de eigen voorraad van mevrouw Van Asperen.
    - id: motief
      question: Waarom moest Cornelia van Asperen dood?
      answer: >-
        Kernpunten: hij had via zijn volmacht ruim 380.000 euro van haar rekeningen naar zijn eigen bv overgemaakt;
        ze had de volmacht ingetrokken en zou op maandag 5 oktober met de bank alle rekeningen doornemen, waardoor de
        verduistering uit zou komen.
  epilogue: >-
    Frank Hoogendijk had in ruim twee jaar 384.500 euro van Cornelia van Asperen verduisterd. Toen achternicht Fleur
    de betalingen ontdekte, trok Cornelia zijn volmacht in en maakte ze een afspraak bij de bank. Op donderdag 1
    oktober, op de vrije middag van Joyce, kwam Frank "alles uitleggen". Terwijl hij een glas water haalde, legde hij
    in de weekdoos extra digoxinetabletten bij, die hij na de dood van zijn moeder had bewaard. Cornelia werd vrijdag
    ziek, zag alles geel en overleed in de nacht van zaterdag op zondag. Op verzoek van notaris Smulders werd de
    crematie stilgelegd. Het NFI vond een dodelijke concentratie digoxine in haar bloed. Frank Hoogendijk is
    aangehouden op verdenking van moord en verduistering. Joyce Mertens en Maarten van Asperen zijn vrijgepleit, en
    het testament van 29 september wordt uitgevoerd zoals Cornelia het wilde.
