        body: |
          Hoi tante Cor,

          Ik snap deze betalingen echt niet. Sinds juli 2024 gaat er bijna elke maand geld naar FH Beheer en Advies,
          rekening NL71 INGB 0006 4471 39. Omschrijving "advieskosten" of "onderhoud landgoed". Maar Kees betaal je
          toch zelf contant?

          Totaal juli 2024 t/m aug 2026: 26 maanden, EUR 384.500 (!!)
          Grootste: 14-02-2025 EUR 42.000 "onderhoud dak koetshuis" -> is dat dak echt gedaan??

          Btw ik wil niemand beschuldigen hoor, maar dit klopt niet. Zullen we het samen met de bank bekijken?

          Liefs, Fleur
