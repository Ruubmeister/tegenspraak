      - id: volmacht-intrekken
        url: https://www.notaris.nl/volmacht-intrekken
        title: Een volmacht intrekken - Notaris.nl
        visitedAt: 2026-09-23T10:02:00
        content: |
          Een volmacht intrekken kan altijd. Laat de intrekking vastleggen bij de notaris en informeer de
          gevolmachtigde schriftelijk. Vermoedt u misbruik? Laat dan uw rekeningen controleren door uw bank.
      - id: verduistering
        url: https://www.zoeken.nl/?q=gevolmachtigde+geld+van+rekening+gehaald+aangifte
        title: gevolmachtigde geld van rekening gehaald aangifte - Zoeken
        visitedAt: 2026-09-23T10:11:00
        content: |
          Misbruik van een volmacht kan verduistering zijn. U kunt aangifte doen bij de politie. Verzamel eerst
          bankafschriften waarop de betalingen te zien zijn.
      - id: geel-zien
        url: https://www.gezondheidsinfo.nl/klachten/geel-zien
        title: Alles geel zien - oorzaken - Gezondheidsinfo.nl
        visitedAt: 2026-10-02T16:41:00
        content: |
          Geel zien (xanthopsie): alles lijkt een gele of groene waas te hebben.

          Mogelijke oorzaken: geelzucht, bepaalde oogaandoeningen, en bijwerkingen van medicijnen.
          Let op: gebruikt u digoxine (Lanoxin)? Dan kan geel zien, samen met misselijkheid en een trage hartslag,
          wijzen op een te hoge spiegel in het bloed. Neem direct contact op met uw arts.
