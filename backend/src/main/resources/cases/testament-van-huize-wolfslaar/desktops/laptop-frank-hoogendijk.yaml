    title: Browser
    pages:
      - id: digoxine-overdosis
        url: https://www.zoeken.nl/?q=digoxine+overdosis+hoeveel+tabletten+dodelijk
        title: digoxine overdosis hoeveel tabletten dodelijk - Zoeken
        visitedAt: 2026-09-30T22:47:00
        content: |
          Digoxine-intoxicatie: symptomen zijn misselijkheid, braken, verwardheid, geel of groen zien en een trage
          of onregelmatige hartslag. Bij ouderen met hartfalen kan een veelvoud van de dagdosis binnen een tot twee
          dagen dodelijk zijn. Klachten worden vaak aangezien voor verergering van het hartfalen.
      - id: digoxine-aantonen
        url: https://www.zoeken.nl/?q=digoxine+aantonen+na+overlijden
        title: digoxine aantonen na overlijden - Zoeken
        visitedAt: 2026-09-30T22:58:00
        content: |
          Digoxine kan na het overlijden in bloed worden aangetoond, maar alleen als er toxicologisch onderzoek
          wordt gedaan. Bij een natuurlijke dood, vastgesteld door de huisarts, gebeurt dat meestal niet.
      - id: crematie-zonder-sectie
        url: https://www.zoeken.nl/?q=crematie+zonder+sectie+verklaring+natuurlijke+dood
        title: crematie zonder sectie verklaring natuurlijke dood - Zoeken
        visitedAt: 2026-09-30T23:10:00
        content: |
          Na een verklaring van natuurlijk overlijden door de huisarts kan zonder verder onderzoek worden
          gecremeerd. Na de crematie is toxicologisch onderzoek niet meer mogelijk.
      - id: route-wolfslaar
        url: https://www.kaarten.nl/route?van=Breda&naar=Wolfslaarlaan+Ulvenhout
        title: Route Breda - Wolfslaarlaan, Ulvenhout - Kaarten
        visitedAt: 2026-10-01T13:38:00
        content: |
          Route van Breda centrum naar Wolfslaarlaan, Ulvenhout: 7,4 km, 14 minuten via de Ulvenhoutselaan.
      - id: crematie-uitstellen
        url: https://www.zoeken.nl/?q=kan+notaris+crematie+tegenhouden
        title: kan notaris crematie tegenhouden - Zoeken
        visitedAt: 2026-10-04T21:02:00
        content: |
          Een executeur kan uitstel van de uitvaart vragen, bijvoorbeeld als er twijfel is over de doodsoorzaak.
          De officier van justitie kan dan alsnog een schouw door een forensisch arts laten doen.
