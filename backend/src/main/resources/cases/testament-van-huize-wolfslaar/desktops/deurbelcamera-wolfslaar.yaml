        description: >-
          Een jonge vrouw met een rugzak zet een fiets tegen de muur naast de voordeur. Geen auto op de oprit.
      - id: donderdag-aankomst
        album: Week 40
        title: Beweging voordeur - do 01-10 14:02
        takenAt: 2026-10-01T14:02:00
        image: donderdag-aankomst.png
        description: >-
          Een donkerblauwe Volvo stationwagen staat op de oprit, kenteken gedeeltelijk leesbaar: "..-KX-..". Een man
          van rond de zestig in een donkere jas met een bruine leren tas loopt naar de voordeur.
      - id: donderdag-vertrek
        album: Week 40
        title: Beweging voordeur - do 01-10 15:24
