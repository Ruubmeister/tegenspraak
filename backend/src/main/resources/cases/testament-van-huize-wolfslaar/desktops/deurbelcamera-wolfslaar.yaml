        description: >-
          Een stevige man van rond de vijftig in een werkjas belt aan. Op de oprit staat een witte bestelbus met de
          tekst "Van Asperen Klussen".
      - id: vrijdag-maarten-weg
        album: Week 40
        title: Beweging voordeur - vr 02-10 21:16
        takenAt: 2026-10-02T21:16:00
