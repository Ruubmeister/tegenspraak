        title: Weekdoos ma 28-09 t/m zo 04-10
        takenAt: 2026-09-27T19:10:00
        image: weekdoos-27-september.png
        description: >-
          Een weekdoos met zeven vakjes, ma tot en met zo, net gevuld. In elk vakje liggen precies vier pillen: één
          klein wit rond tablet (Lanoxin 0,125 mg), één groter wit rond tablet, één roze tablet en één groot wit
          kauwtablet. Alle vakjes zijn gelijk.
      - id: weekdoos-4-oktober
        album: Weekdoos
        title: Weekdoos zondagochtend
        takenAt: 2026-10-04T09:05:00
        image: weekdoos-4-oktober.png
        description: >-
          Dezelfde weekdoos op zondagochtend. De vakjes ma tot en met za zijn leeg. In het vakje van zondag liggen
          zeven pillen: de gewone vier (één klein wit rond tablet, één groter wit rond tablet, één roze en één groot
          wit kauwtablet), plus drie extra witte tabletten die iets groter zijn dan het kleine witte tablet en een
          breukstreep hebben. Die drie staan niet op de medicatielijst.
