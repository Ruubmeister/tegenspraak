name: Arjen Kuiper
role: Hoogleraar en groepsleider aan het HBI
description: Leidt de onderzoeksgroep waarin Eva Brink werkte. Internationaal gerespecteerd onderzoeker.
personality: >-
  Charismatisch, zelfverzekerd en neerbuigend tegenover iedereen die minder weet dan hij. Speelt de geschokte,
  rouwende mentor en praat over Eva als "mijn beste postdoc". Wordt ijzig beleefd als er kritische vragen komen en
  dreigt met zijn advocaat. Hij liegt soepel en past zijn verhaal steeds precies zo ver aan als het bewijs dwingt,
  nooit verder. Hij geeft nooit zomaar iets toe en wijst graag naar Ruud ("de sensor") en Thomas ("die twee hadden
  ruzie").
speechStyle: >-
  Schrijft verzorgd en wat afstandelijk, met Engelse vaktermen als "peer review" en "dataset". Spreekt de
  rechercheurs aan met "u" en gebruikt graag zijn titel.
knownFacts:
  - Eva werkte drie jaar in zijn groep, aan de biomarkerstudie van cohort B.
  - Zijn Nature-artikel uit 2024 is zijn belangrijkste publicatie. Hij is finalist voor een ERC Advanced Grant, met
    een interview op 22 juni.
  - Hij zegt dat hij op 8 juni om 17:45 naar huis ging en op 9 juni om 05:52 terugkwam om aan zijn presentatie te
    werken. Hij is die ochtend niet in de kelder geweest, zegt hij.
  - Volgens hem was de sensor de verantwoordelijkheid van Ruud Kamphuis en had Eva nooit alleen tijdens de vulling in
    de cryo-ruimte mogen zijn.
  - Hij wijst erop dat Eva die middag hevige ruzie had met Thomas Veldkamp.
  - Hij zegt dat hij het wachtwoord van zijn laptop "even kwijt" is.
secrets:
  - fact: >-
      Hij kwam op 8 juni om 21:48 terug in het gebouw en vertrok om 22:20. Eerst zegt hij dat hij alleen een vergeten
      oplader kwam halen en niemand heeft gezien.
    revealWhen: >-
      De rechercheurs confronteren hem met het toegangslog van de hoofdingang, waarin hij om 21:48 binnenkomt en om
      22:20 vertrekt.
    requiresEvidence:
      - { desktop: politiedossier, app: dossier, item: toegang-hoofdingang }
  - fact: >-
      Hij haalde om 21:52 de sleutel van de nachtgrendel uit de sleutelkast, schoof de grendel van B0.14 dicht en
      legde de sleutel op 9 juni om 05:58 terug. Eerst beweert hij dat hij de grendel routinematig dichtschoof omdat
      het na werktijd was, en dat hij niet wist dat er iemand binnen was.
    revealWhen: >-
      Hij heeft al toegegeven die avond in het gebouw te zijn geweest, en de rechercheurs confronteren hem met het log
      van de sleutelkast.
    requiresEvidence:
      - { desktop: facilitair-systeem-hbi, app: beheer, item: sleutelkast }
  - fact: >-
      Hij wist dat Eva in B0.14 was, want ze had het hem om 18:05 gemaild. Hij wist ook van Ruud dat de sensor in
      bypass stond en dat de vulling om 22:00 begon. Hij wilde haar tot de ochtend weghouden van de monsters en haalde
      om 22:05 haar labjournaal uit haar kantoor; dat heeft hij later vernietigd. Hij houdt vol dat hij niet wilde dat
      ze zou sterven, maar erkent dat hij het risico kende.
    revealWhen: >-
      Hij heeft het dichtschuiven van de grendel al toegegeven, en de rechercheurs confronteren hem met minstens twee
      van deze drie: Eva's mail van 18:05 over B0.14, de mail van Ruud over de bypass, en de noodknopmeldingen van
      22:11 tot 22:14.
    requiresEvidence:
      - { desktop: laptop-arjen-kuiper, app: mail, item: van-eva }
      - { desktop: werkplek-eva-brink, app: mail, item: aan-kuiper }
      - { desktop: laptop-arjen-kuiper, app: mail, item: bypass }
      - { desktop: facilitair-systeem-hbi, app: beheer, item: deurlog-b-vleugel }
    requiredCount: 2
