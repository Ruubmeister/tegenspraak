        name: PV_aantreffen_09-06.txt
        content: |
          Proces-verbaal van bevindingen
          Datum: 9 juni 2026, 08:05

          Om 07:44 melding van het HBI: medewerker levenloos aangetroffen in cryo-opslag B0.14.
          Slachtoffer: dr. E. Brink (34), aangetroffen op de vloer, circa een meter van de deur.
          Aangetroffen door: R. Kamphuis, technicus, die om 07:40 de ruimte met zijn badge betrad.

          Deur B0.14: gesloten, nachtgrendel (mechanisch, buitenzijde) geopend.
          Noodknop binnenzijde: bij test door technische recherche om 10:15 functioneel, deur opent direct.
          Zuurstofsensor: geen alarm gegeven. Onderhoudslog vermeldt vervanging op 6 juni.
          Persoonlijke bezittingen: telefoon en tas in kantoor B1.22. Geen labjournaal aangetroffen.
          Volgens collega's werkte slachtoffer altijd met een blauw labjournaal.
