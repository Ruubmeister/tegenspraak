        content: |
          Samenvatting verklaringen (afgenomen op 9 en 10 juni)

          A. Kuiper (groepsleider): op 8 juni om 17:45 naar huis. Op 9 juni om 05:52 terug om te werken aan
          ERC-presentatie, in eigen kantoor (2e verdieping). Niet in de kelder geweest. Slachtoffer was
          "zijn beste postdoc". Wijst op ruzie tussen slachtoffer en T. Veldkamp.

          T. Veldkamp (postdoc): "rond acht uur" naar huis. Had die middag een "meningsverschil" met het
          slachtoffer over de verdeling van werk.

          R. Kamphuis (technicus): sensor op 6 juni vervangen en getest, "alles was in orde".

          L. Brink (zus): toont appbericht van 21:43. Gelooft niet in een ongeluk. Bericht niet relevant
          geacht voor de toedracht.

          Voorlopige conclusie: ongeval. Slachtoffer was alleen in B0.14 tijdens de automatische vulling,
          sensor vermoedelijk defect, slachtoffer raakte bewusteloos voordat ze de deur bereikte.
