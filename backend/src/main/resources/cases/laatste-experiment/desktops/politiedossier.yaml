        content: |
          NFI - samenvatting sectierapport E. Brink

          Doodsoorzaak: verstikking door zuurstoftekort (hypoxie).
          Tijdstip van overlijden: tussen 22:00 en 23:30 op 8 juni 2026.
          Uitwendig: kneuzingen en schaafwonden aan de knokkels van de rechterhand, recent ontstaan.
          Opmerking politie: vermoedelijk bij het vallen opgelopen.
          Geen aanwijzingen voor geweld door derden. Geen alcohol of medicatie.
