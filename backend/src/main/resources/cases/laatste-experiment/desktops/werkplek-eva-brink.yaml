          Vergelijking cohort B - E. Brink, mei 2026

          Nature 2024, figuur 3: n = 112 patiëntmonsters (cohort B)
          Biobankregister cohort B: 74 monsters geregistreerd, alle met ontvangstdatum en label

          38 monsters in de dataset hebben geen registratie in de biobank. De waarden van deze 38 liggen
          allemaal opvallend dicht bij de trendlijn. Zonder deze 38 is het effect niet significant (p = 0,21).

          De dataset is samengesteld door A. Kuiper (zie metadata, 14-02-2024).
          Bewijs: originele dozen B-01 t/m B-08 in vat 3 van B0.14. Daar zitten er maar 74 in.
