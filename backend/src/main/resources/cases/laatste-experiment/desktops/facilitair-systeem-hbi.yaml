      - id: werkinstructie-cryo
        folder: Veiligheid
        name: Werkinstructie_cryo-opslag_B0.14.txt
        content: |
          Werkinstructie cryo-opslag B0.14

          - Automatische vulling van de stikstofvaten: dagelijks 22:00 - circa 22:40.
          - Nooit alleen in B0.14 tijdens de vulling. Na 18:00 alleen met melding aan de beveiliging.
          - De zuurstofsensor schakelt bij O2 < 19,5% het alarm en de noodventilatie in.
          - Noodknop binnenzijde opent de deur direct, BEHALVE als de nachtgrendel (buitenzijde) gesloten is.
          - Nachtgrendel alleen sluiten na controle dat de ruimte leeg is (kijk door het raam).
          - Sleutel nachtgrendel (NG-B0) in elektronische sleutelkast, alleen groepsleiders en facilitaire dienst.
