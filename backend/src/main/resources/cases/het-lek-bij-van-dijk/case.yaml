title: Het lek bij Van Dijk Vastgoed (oefenzaak)
summary: >-
  Een vastgoedbedrijf verliest een miljoenenproject met een verschil van precies tienduizend euro.
  Toeval, of heeft iemand het bod gelekt?
introduction: >-
  Pieter van Dijk, directeur van Van Dijk Vastgoed, heeft je ingehuurd. Zijn bedrijf verloor de aanbesteding
  voor de herontwikkeling van de Oude Suikerfabriek in Leiden aan concurrent Kramer Bouw, dat precies
  tienduizend euro lager bood. Pieter vermoedt een lek. Je hebt toegang gekregen tot de werkplek van
  officemanager Sanne Bakker en tot de gedeelde schijf van het bedrijf. Sanne is bereid met je te chatten.
setting: >-
  Van Dijk Vastgoed bood 4.250.000 euro voor de Oude Suikerfabriek. Kramer Bouw won met 4.240.000 euro.
  Sanne Bakker (officemanager) stuurde op 12 maart om 21:47 het definitieve bod door naar haar privé-adres
  (sanne.bakker84@gmail.com) om er thuis nog aan te werken; dat is tegen de bedrijfsregels. Haar vriend
  Dennis de Vries is projectleider bij Kramer Bouw. Die avond werkte Sanne op de gedeelde laptop thuis en liet
  haar mail openstaan. Dennis heeft het bod gezien en het bedrag aan zijn directeur doorgegeven.
  Sanne vermoedt dit sinds de uitslag, maar heeft het aan niemand verteld. Pieter van Dijk weet niets van Dennis.
solution:
  questions:
    - id: wie
      question: Wie heeft het bedrag van het bod aan Kramer Bouw doorgegeven?
      answer: Dennis de Vries, de vriend van Sanne Bakker.
    - id: hoe
      question: Hoe kwam die persoon aan het bedrag van het bod?
      answer: >-
        Kernpunten: Sanne Bakker stuurde het definitieve bod naar haar privé-mailadres; Dennis zag het bod thuis op de
        gedeelde laptop, waar haar mail openstond.
    - id: opzet
      question: Heeft Sanne Bakker het bod bewust gelekt? Leg uit.
      answer: >-
        Kernpunten: nee, ze lekte het niet bewust; ze was onvoorzichtig door het bod tegen de regels naar haar
        privé-adres te sturen en haar mail thuis open te laten staan.
  epilogue: >-
    Op de avond van 12 maart stuurde Sanne Bakker het definitieve bod naar haar privé-adres om thuis bijlage B
    te controleren. Ze werkte op de laptop die ze deelt met haar vriend Dennis de Vries, projectleider bij Kramer
    Bouw, en liet haar mail openstaan. Dennis zag het bedrag van 4.250.000 euro en gaf het door aan zijn directeur.
    Kramer Bouw bood precies tienduizend euro minder en won. Sanne vermoedde het sinds de uitslag, maar durfde
    het niemand te vertellen. Pieter van Dijk legt de zaak voor aan de gemeente en zijn advocaat.
