        title: Puzzelmaker Wouter Klaver (63) dood gevonden - De IJsselbode
        visitedAt: 2026-11-14T14:30:00
        content: |
          Wouter Klaver, al 25 jaar de maker van de Zaterdagbreker, is zaterdagochtend dood gevonden in zijn woning
          aan de Bergstraat. Volgens de politie is hij vermoedelijk van de trap gevallen. Zijn laatste puzzel staat
          vandaag in de krant.
      - id: verkoop-havenkwartier
        url: https://www.ijsselbode.nl/deventer/grond-havenkwartier-noord-verkocht
        title: Grond Havenkwartier Noord verkocht aan Zandbergen - De IJsselbode
        visitedAt: 2026-11-16T10:48:00
        content: |
          (Archief, 4 februari 2025) De gemeente Deventer heeft de grond van Havenkwartier Noord voor 3,1 miljoen
          euro verkocht aan Zandbergen Vastgoed. Wethouder: "Door de zware bodemverontreiniging, met een sanering
          van 6,2 miljoen, was er geen andere koper." Het bodemrapport is opgesteld door Bodemadvies Oost.
