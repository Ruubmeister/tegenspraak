        name: Zaterdagbreker_1306.txt
        content: |
          DE ZATERDAGBREKER - nr. 1306 - zaterdag 14 november 2026
          door Wouter Klaver

          Thema: Rondje Deventer. Een letterpuzzel deze week. Wie goed begint, vindt wat ik verstopte.

           1. Deventer lekkernij, taai en kruidig (4)
           2. Kerk aan het Grote Kerkhof, genoemd naar een Angelsaksische zendeling (8)
           3. De provincie waarin Deventer ligt (10)
           4. Ronde stenen in de Bergstraat (5)
           5. Hier meert de rondvaartboot aan, langs de IJssel (4)
           6. Wat terugkomt als je in een lege kerk roept (4)
           7. Als de Brink stil is en zelfs de puzzelaar slaapt (5)
           8. Elk jaar in augustus staan er zes kilometer van langs de IJssel, vol boeken (6)
           9. Wat je bij elke omschrijving hierboven zoekt (8)
          10. Wat vroeger de hele stad omringde (4)
          11. Sterke boom die eikels draagt (3)
          12. Wat de IJssel is (6)

          Geen oplossingsbalk deze week. De oplossing staat volgende week in de krant.
      - id: breker-1305
        folder: Puzzels
        name: Zaterdagbreker_1305.txt
        content: |
          DE ZATERDAGBREKER - nr. 1305 - zaterdag 7 november 2026
          door Wouter Klaver

          Cryptogram. Vul de antwoorden in het diagram in; de letters in de grijze vakjes vormen de oplossing.
          (24 omschrijvingen, zie de papieren krant.)

          Oplossingsbalk: _ _ _ _ _   _ _ _ _ _ _ _ _

          Oplossing vorige week: STADSWAAG
      - id: jubileum
        folder: Artikelen
        name: Jubileum_25_jaar_Zaterdagbreker.txt
        content: |
          25 jaar Zaterdagbreker: Wouter Klaver breekt nog altijd hoofden
          De IJsselbode, 3 oktober 2026

          Op zaterdag 6 oktober 2001 stond de allereerste Zaterdagbreker in De IJsselbode. Sindsdien heeft Wouter
          Klaver (63) er ruim 1300 gemaakt, zonder één week over te slaan. "Zelfs niet toen mijn vrouw Hennie
          overleed", zegt hij. "Toen heb ik haar naam in de beginletters van de omschrijvingen verstopt. Bijna
          niemand heeft het gezien."

          Klaver is ook vrijwilliger bij het Stadsarchief en wint al twintig jaar elke woensdagavond het
          torenuurwerk van de Bergkerk op. "Daarboven, tussen de tandwielen, bedenk ik mijn beste omschrijvingen."
          Puzzelclub De Waag, met voorzitter Anneke Visser, bood hem bij het jubileum een gouden potlood aan.
