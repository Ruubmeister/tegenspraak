        to: m.dijkhuis@bodemadviesoost.nl
        subject: Bodemrapporten Havenkade Noord
        sentAt: 2026-11-02T10:31:00
        body: |
          Geachte mevrouw Dijkhuis,

          Als vrijwilliger van het Stadsarchief heb ik twee bodemrapporten over Havenkade Noord in handen, beide
          met uw handtekening: 2024-HK-09 (lichte verontreiniging, sanering circa 0,4 miljoen) en 2025-HK-17
          (zware verontreiniging, 6,2 miljoen). Op dezelfde grond, met drie maanden ertussen. Kunt u mij dat
          uitleggen?

          Met vriendelijke groet,
          Wouter Klaver
