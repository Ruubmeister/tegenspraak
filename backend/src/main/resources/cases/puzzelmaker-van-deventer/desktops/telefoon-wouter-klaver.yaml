          Laat het rusten, Klaver. Sommige dozen kun je beter dicht laten.
      - id: aan-dijkhuis-2
        folder: Verzonden
        from: wouter.klaver@kpnmail.nl
        to: m.dijkhuis@bodemadviesoost.nl
        subject: "Re: Bodemrapporten Havenkade Noord"
        sentAt: 2026-11-10T20:02:00
        body: |
          Mevrouw Dijkhuis,

          U heeft niet gereageerd. Ik geef u tot maandag 16 november. Daarna gaat alles naar De IJsselbode en de
          gemeenteraad. Ik denk niet dat u dit alleen heeft bedacht, en ik wil u de kans geven dat te vertellen.

          Wouter Klaver
