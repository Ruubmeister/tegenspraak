      - id: galeriegeschiedenis
        folder: Pers
        name: Over_de_galerie.txt
        content: |
          Galerie Lindeboom werd in 1991 opgericht door Victor Lindeboom in de Kleine Houtstraat in Haarlem.
          Victor raakte al jong in de ban van de schilder Marius Brandt (1889-1951). In 1994 kocht hij zijn
          eerste Brandt, het Duinlandschap bij Bloemendaal, dat sindsdien het hart van de collectie vormt.
          In 2002 volgde Vrouw met parasol.
