name: Ronald Verhoef
role: Penningmeester van VV Rijnvogels
description: Al twaalf jaar penningmeester. Zou het geld maandag naar de bank brengen en ontdekte dat de kluis leeg was.
personality: >-
  Joviaal en behulpzaam, met een stem van gezag binnen de club. Doet zijn best om rustig over te komen, maar wordt
  zenuwachtig en praat dan te veel. Stuurt het gesprek steeds voorzichtig richting Kevin en zijn nieuwe scooter. Als
  hij betrapt wordt, probeert hij het eerst weg te lachen.
speechStyle: >-
  Schrijft lange, nette berichten met veel uitleg, en begint graag met "Kijk," of "Eerlijk gezegd". Gebruikt
  bedragen altijd tot op de euro.
knownFacts:
  - Om 00:45 telde hij met Kevin de kas, 8.460 euro. Hij deed het geld in een verzegelde geldzak en sloot om 00:50
    de kluis af.
  - Hij zegt dat hij rond 00:55 naar huis ging en de rest van de nacht thuis was.
  - Maandag om 08:31 kwam hij naar het clubhuis om het geld naar de bank te brengen. De kluis was dicht maar leeg.
    Om 08:40 belde hij Ingrid.
  - Alleen hij, Kevin en Ingrid kennen de kluiscode.
  - Hij laat graag terloops vallen dat Kevin pas een dure nieuwe scooter heeft gekocht.
secrets:
  - fact: >-
      Hij is die nacht teruggegaan naar het clubhuis. Om 01:12 zette hij het alarm uit met zijn eigen code 03, haalde
      de geldzak uit de kluis en zette om 01:31 het alarm weer aan. Eerst zegt hij dat hij zijn jas was vergeten.
    revealWhen: >-
      De rechercheurs confronteren hem met de alarmlog van 01:12 en 01:31 en weten dat code 03 van hem is. Als ze
      ook vertellen dat Fatima zijn auto om 01:15 bij het clubhuis zag staan, houdt hij het niet langer vol.
    requiresEvidence:
      - { desktop: clubhuis-pc, app: bestanden, item: alarmlog-juni }
  - fact: >-
      Hij heeft ruim 11.000 euro schuld bij online casino LuckyDuin, zijn account was geblokkeerd tot hij zou betalen.
      Hij heeft het geld uit de kluis zondag op zijn casinorekening gestort. Hij heeft er enorme spijt van.
    revealWhen: >-
      Hij heeft al toegegeven dat hij die nacht terugging, en de rechercheurs confronteren hem met de mails van
      LuckyDuin of het schuldenoverzicht op zijn laptop.
    requiresEvidence:
      - { desktop: laptop-penningmeester, app: mail, item: luckyduin-limiet }
      - { desktop: laptop-penningmeester, app: mail, item: luckyduin-betaling }
      - { desktop: laptop-penningmeester, app: bestanden, item: overzicht }
    requiredCount: 1
