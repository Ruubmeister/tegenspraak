spring:
  application:
    name: tegenspraak
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # Answering consultations waits for the LLM; the event stream heartbeat must not wait behind it
        size: 2
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-5-5
        max-tokens: 16000

springdoc:
  api-docs:
    # Only the build needs the spec, see OpenApiSpecIT; the running application does not serve it
    enabled: false
  # A stable, readable spec file, so changes show up as small diffs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  model-converters:
    # Fields annotated with @Nullable may be null in the JSON
    java-nullable-property-customizer:
      enabled: true
    polymorphic-converter:
      enabled: true

server:
  port: 8081
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

tegenspraak:
  cases:
    location: classpath:cases
  chat:
    max-history-messages: 40
    # Judges the tone of each player message to shift the character's mood; a small model keeps this fast and cheap
    tone-classifier-model: claude-haiku-5-5
  consultations:
    # A character that asks another character something gets the answer after a random delay in this range
    min-reply-delay: 2m
    max-reply-delay: 5m
    # How often due answers are checked
    poll-interval: 15s
    # A failed answer is retried after retry-delay times the number of failures, up to max-attempts in total
    retry-delay: 1m
    max-attempts: 3
  live-updates:
    # Keeps proxies from closing idle event streams, and closes streams of players who left the team or logged out
    heartbeat-interval: 25s
    # Streams end after this long and the browser reconnects, which checks the session again
    stream-timeout: 30m
  verdict:
    # A team that has not solved a case after this many attempts has failed it and gets to read the epilogue
    max-attempts: 5
  admin:
    username: admin
    initial-password: ${TEGENSPRAAK_ADMIN_PASSWORD:}
  locks:
    # A team may enter this many wrong codes per locked item within the window, then it has to wait
    max-wrong-attempts: 5
    wrong-attempt-window: 1m
