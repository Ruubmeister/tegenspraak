spring:
  application:
    name: tegenspraak
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-5-5
        max-tokens: 16000

server:
  port: 8081
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

tegenspraak:
  cases:
    location: classpath:cases
  chat:
    max-history-messages: 40
  verdict:
    # A team that has not solved a case after this many attempts has failed it and gets to read the epilogue
    max-attempts: 5
  admin:
    username: admin
    initial-password: ${TEGENSPRAAK_ADMIN_PASSWORD:}
  locks:
    # A team may enter this many wrong codes per locked item within the window, then it has to wait
    max-wrong-attempts: 5
    wrong-attempt-window: 1m
